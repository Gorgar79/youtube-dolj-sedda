<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="popupTitle"></title>
  <style>
    body {
      width: 310px;
      margin: 0;
      padding: 14px 16px;
      font: 13px/1.4 system-ui, Segoe UI, Roboto, sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
    }
    h1 { display: flex; align-items: center; gap: 8px; font-size: 15px; margin: 0 0 12px; }
    h1 img { width: 22px; height: 22px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0; }
    .row label { flex: 1; cursor: pointer; }
    .threshold { display: flex; align-items: center; gap: 8px; margin: 4px 0 12px; }
    .threshold input[type=range] { flex: 1; accent-color: #f00; }
    .threshold input[type=number] {
      width: 52px; background: #272727; color: #fff;
      border: 1px solid #3f3f3f; border-radius: 4px; padding: 3px 4px;
    }
    input[type=checkbox] { flex: none; width: 16px; height: 16px; accent-color: #f00; cursor: pointer; }
    hr { border: none; border-top: 1px solid #3f3f3f; margin: 12px 0; }
    .muted { color: #aaa; font-size: 12px; }
    button {
      flex: none;
      background: #272727; color: #fff; border: 1px solid #3f3f3f;
      border-radius: 16px; padding: 5px 12px; cursor: pointer; font: inherit;
    }
    button:hover { background: #3f3f3f; }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <h1><img src="icons/icon32.png" alt=""><span data-i18n="popupTitle"></span></h1>

  <div class="row">
    <label for="enabled" data-i18n="optEnabled"></label>
    <input type="checkbox" id="enabled">
  </div>

  <div class="muted" data-i18n="thresholdLabel"></div>
  <div class="threshold">
    <input type="range" id="thresholdRange" min="1" max="100" step="1">
    <input type="number" id="thresholdNumber" min="1" max="100" step="1"> %
  </div>

  <hr>

  <div class="row">
    <label for="showManualButton" data-i18n="optShowManualButton"></label>
    <input type="checkbox" id="showManualButton">
  </div>
  <div class="row">
    <label for="includeHome" data-i18n="optIncludeHome"></label>
    <input type="checkbox" id="includeHome">
  </div>
  <div class="row">
    <label for="revealHidden" data-i18n="optRevealHidden"></label>
    <input type="checkbox" id="revealHidden">
  </div>

  <hr>

  <div class="row">
    <span class="muted" id="manualCount"></span>
    <button id="clearManual" data-i18n="clearButton"></button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
